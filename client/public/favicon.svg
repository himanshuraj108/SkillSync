<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="logo-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="white-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
  </defs>

  <!-- Background squircle tile -->
  <rect width="32" height="32" rx="9" fill="url(#logo-bg-grad)" />

  <!-- Left User (Peer 1) -->
  <circle cx="6.5" cy="11.5" r="2.5" fill="url(#white-grad)" />
  <path d="M2.5 22c0-2.4 1.8-4.2 4-4.2h1.5c.8 0 1.5.3 2.1.8" stroke="url(#white-grad)" stroke-width="2" stroke-linecap="round" />

  <!-- Center PC / Laptop Meeting Screen -->
  <rect x="11" y="9.5" width="10" height="7.5" rx="1.5" fill="#0f172a" stroke="url(#white-grad)" stroke-width="1.6" />
  <!-- Live 2-Way Meeting Presence on Screen -->
  <circle cx="14" cy="13.2" r="1" fill="#38bdf8" />
  <circle cx="18" cy="13.2" r="1" fill="#a855f7" />
  <path d="M15.4 13.2h1.2" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />
  <!-- Laptop Keyboard Base -->
  <path d="M9.5 18h13c.4 0 .7.3.6.7l-.3.8c-.1.3-.4.5-.7.5H9.9c-.3 0-.6-.2-.7-.5l-.3-.8c-.1-.4.2-.7.6-.7z" fill="url(#white-grad)" />

  <!-- Right User (Peer 2) -->
  <circle cx="25.5" cy="11.5" r="2.5" fill="url(#white-grad)" />
  <path d="M29.5 22c0-2.4-1.8-4.2-4-4.2h-1.5c-.8 0-1.5.3-2.1.8" stroke="url(#white-grad)" stroke-width="2" stroke-linecap="round" />
</svg>
